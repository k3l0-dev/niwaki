# niwaki — OpenSSF Scorecard
#
# Weekly supply-chain health check: independently verifies the pinning,
# token-permissions and branch-protection posture, publishes the public
# score (README badge) and uploads findings to the Security tab.

name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "31 6 * * 1"

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          sarif_file: results.sarif
